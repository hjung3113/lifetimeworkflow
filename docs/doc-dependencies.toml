# Human-docs dependency registry (DOCSUP-01).
#
# Each [[binding]] declares: "when THESE sources change, THAT human-authored document owes a
# review." The registry is agent-writable by design — an agent may PROPOSE a row here — but the
# review ledger (docs/.docs-review-ledger.toml) is human-authored only, because the ledger, not the
# registry, is the greenness authority. That asymmetry is the whole point of the split.
#
# Validated ONLY by tools.docs_guard.registry against
# contracts/harness/docs/doc-dependencies.schema.json: this is a .toml instance under docs/, so
# /contract-check's schema/instance pairing does not cover it (D-16 / A7).
#
# Pairing rule: a binding whose sources do not genuinely determine its target is noise that trains
# reviewers to rubber-stamp. Every row below names source files the target document describes
# directly — literal CLI invocations, a named module, or a declared rule set.
#
# GEN-04: no instance-tree selector or target may appear in this CORE registry — the core depends on
# no instance. An instance-local overlay is the D-14 seam and is deliberately not built yet.
#
# severity: `required` fails the guard when stale; `advisory` warns on stderr and never flips the
# exit code.

# GEN-03 project-config slot — the harness's language/toolchain SINGLE SOURCE OF TRUTH (D-03).
#
# Pure DATA. No enforcement logic lives here (mirrors harness/permission-matrix.json's data-only
# posture). The participating languages are a SLOT a project fills, not a core hardcode: the values
# below are the *log-parser example instance's* declared toolchains (.NET 10 + Python/uv), placed in
# the active-instance slot. Cloning this repo as a domain-neutral template = swap these tables.
#
# Consumers:
#   * tools/harness_config/loader.py — stdlib `tomllib` reader; exposes the language list + the
#     `language_bash_scopes()` helper (union of bash_scope + the implicit Python test-runner scope).
#   * tools/harness_lint/tests/test_language_config.py — the GEN-03 CONSISTENCY gate: the
#     permission-matrix `dotnet */uv */pytest *` allow-scopes and the engineer personas MUST agree
#     with what this file declares. A silent divergence fails the suite (config = SSOT, no codegen —
#     per D-03 "full codegen is overkill").

[instance]
# "" = the generic default instance rooted at this repo. A downstream project that vendors the
# harness overrides `root` (and the [[languages]] tables) from its own copy of this file.
root = ""

# TCP-05 risk-policy overlay slot.  A downstream instance may point this at its own
# declarative TOML overlay; the core does not discover or reference instance paths.
# An empty value means the runtime-neutral core policy is effective by itself.
risk_overlay = ""

[[languages]]
id = "dotnet"
bash_scope = "dotnet *"                      # matches permission-matrix.json bash allow-scope
test = "dotnet test"
format = "dotnet format"
sdk_bootstrap = "tools/bootstrap/install.sh" # env has no .NET; bootstrap installs channel 10.0
persona = "examples/log-parser/agents/dotnet-engineer.md"
# CI test target(s) for the Phase-6 matrix: the example has 3 .csproj + NO .sln, so a bare
# `dotnet test` has no project to resolve and fails — name the test project explicitly.
test_paths = ["examples/log-parser/libs/dotnet/Normalize.Tests/Normalize.Tests.csproj"]

[[languages]]
id = "python"
bash_scope = "uv *"                          # matches permission-matrix.json bash allow-scope
test = "uv run pytest"
format = "ruff format"
persona = "harness/agents/python-engineer.md"
# CI test target(s) for the Phase-6 matrix: the example's pytest suite lives OFF the root
# `testpaths`, so the matrix must point at the example tests dir explicitly.
test_paths = ["examples/log-parser/tests"]

# BEGIN PIPE-01 topology
# PIPE-01 pipeline-topology DATA slot — the GENERIC-DEFAULT topology every later plan reads
# (conductor routing, /pipeline trace, instance overlay). Pure DATA, no enforcement (mirrors the
# [[languages]] posture above). This is the domain-NEUTRAL default: a two-stage source→sink line
# carrying the generic `greeting` contract (the tracked sample schema contracts/sample/greeting.schema.json).
# The concrete multi-component topology is supplied by an
# INSTANCE overlay (Plan 04), NOT here — the core must stay generic (GEN-04).
#
# Consumers:
#   * tools/harness_config/loader.py — `components()` + `pipeline()` passthrough helpers.
#   * tools/harness_lint/tests/test_pipeline_config.py — the topology CONSISTENCY gate: every
#     component.language must be a declared [[languages]].id, and every [pipeline] edge must be
#     well-formed (endpoints declared, contract in the from-component's produces AND the
#     to-component's consumes). A malformed topology fails the suite loud.
#
# Each `component.language` MUST match a declared [[languages]].id above (`python` is valid).
[[components]]
id = "source"
stage = 1
language = "python"
produces = ["greeting"]
consumes = []

[[components]]
id = "sink"
stage = 2
language = "python"
produces = []
consumes = ["greeting"]

[pipeline]
edges = [
  { from = "source", to = "sink", contract = "greeting" },
]
# END PIPE-01 topology

# BEGIN CONTRACT-GRAPH topology-relationships
# TOPO-02 contract-relationship DATA slot — the additive coexistence seam between the legacy linear
# [pipeline] model and the general authority/dependent relationship vocabulary (contracts/harness/
# topology/relationship.schema.json). Pure DATA, no enforcement (mirrors the [[languages]] +
# [pipeline] posture above). The generic-default topology declares NO explicit records: the current
# linear source→sink/greeting edge is LOWERED on demand by effective_relationships(), so this table
# stays empty until a downstream project opts in with its own [[contract_graph.relationships]] rows.
#
# Each explicit record (when present) mirrors the schema fields 1:1: id, contract, authority,
# dependents (+ optional kind/labels). No graph resolution / endpoint existence check lives here —
# that is the Phase-25 compiler's job.
#
# Consumers:
#   * tools/harness_config/loader.py — contract_graph_relationships() (raw passthrough) +
#     effective_relationships() (deterministic legacy-edge lowering + union) helpers.
[contract_graph]
# END CONTRACT-GRAPH topology-relationships

# Lane discipline declarations (LANE-01 / LANE-02).
#
# harness/risk-policy.toml says WHICH lane owes a discipline.  This file says WHAT the discipline is
# and what discharges it.  tools/discipline/check.py decides whether it happened, and
# tools/task_control refuses the transition when it did not.  The split is deliberate: the lane
# matrix is risk policy, the declaration is method, and Phase 37 can re-route the method by
# capability without touching the risk policy.
#
# This is runtime-neutral harness DATA, not a contract.  Every id named by any lane in
# risk-policy.toml must appear here, and every `skill` must be a real harness/skills/<name>/SKILL.md
# — tools/harness_lint/tests/test_discipline_wiring.py fails in both directions.
#
# Fields
#   skill            the authored procedure an agent follows to satisfy the discipline
#   capability       (LANE-03) the KIND of agent the method needs, declared in
#                    harness/capabilities.toml.  Never a persona name: the record names the agent
#                    that carried the work out, and an agent outside that capability's allowlist
#                    makes the record invalid, so the transition is refused.
#   owed_by_phase    the discipline is owed when entering this phase OR any later one, in the
#                    canonical phase order declared by the task-control transitions contract
#   outputs_required the minimum number of repo-relative output paths the record must cite; every
#                    cited path must EXIST, so a record cannot be a bare assertion
#   min_experts      (panel only) distinct expert seats the record must carry
#   verdicts         (panel only) the closed verdict vocabulary a seat may report

version = 1

[discipline.clarify]
skill            = "clarify"
capability       = "implementation"
owed_by_phase    = "EXECUTE"
outputs_required = 1

[discipline.test-driven-change]
skill            = "test-driven-change"
capability       = "implementation"
owed_by_phase    = "REVIEW"
outputs_required = 1

# LANE-02: the STRICT+ adversarial multi-expert review panel, owed before VERIFY — the same boundary
# at which the lane already owes its review_record artifact.  Three seats is the floor: below three
# a "panel" is a pair, and the seats must be DISTINCT because one opinion typed three times is not
# multi-expert review.
[discipline.adversarial-review-panel]
skill            = "adversarial-review-panel"
capability       = "adversarial-review"
owed_by_phase    = "VERIFY"
outputs_required = 1
min_experts      = 3
verdicts         = ["pass", "concerns", "block"]

[discipline.diagnose]
skill            = "diagnose"
capability       = "implementation"
owed_by_phase    = "EXECUTE"
outputs_required = 1

[discipline.domain-modeling]
skill            = "domain-modeling"
capability       = "implementation"
owed_by_phase    = "PLAN"
outputs_required = 1

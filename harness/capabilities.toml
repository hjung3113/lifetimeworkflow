# Capability declarations and the per-capability agent ALLOWLIST (LANE-03).
#
# harness/disciplines.toml says a lane's method needs a CAPABILITY.  This file says which personas
# are allowed to serve that capability.  tools/capability/registry.py decides whether a concrete
# route is permitted, tools/discipline/check.py turns a refused route into an unsatisfied
# discipline, and tools/task_control refuses the phase transition.  Routing therefore stops being a
# persona name typed into a table and becomes a declaration something can refuse.
#
# This is runtime-neutral harness DATA, not a contract — the same plane as risk-policy.toml and
# disciplines.toml.  It is deliberately NOT agent frontmatter: tools/harness_emit/project_agent.py
# projects a FIXED key list per runtime, so a `capabilities:` key authored on an agent would be
# silently dropped from BOTH emitted trees.  A declaration that does not survive emit is exactly the
# claimed control this milestone exists to remove.
#
# WHY THE ALLOWLIST IS PER CAPABILITY AND NOT PER LANE.  tools/risk_router/router.py validates each
# lane's `required_*` list as a monotone SUPERSET of the lane below: a stricter lane may only ADD an
# obligation.  An allowlist narrows as risk rises, so a per-lane allowlist would be monotone in the
# wrong direction.  Narrowing is expressed here by requiring a STRICTER CAPABILITY, and the lane
# matrix keeps one meaning for all of its keys.
#
# Fields
#   description  what the capability is for, in one line
#   providers    the closed allowlist of harness/agents/<name>.md personas that may serve it
#   read_only    when true, every provider must hold NO write/shell affordance in either runtime
#                representation (checked with tools.harness_lint.caps.is_read_only)
#
# tools/harness_lint/tests/test_capability_wiring.py fails in both directions: a provider that is
# not a real core persona, a core persona no capability can route to, a read-only capability served
# by a write-capable agent, and a discipline naming an undeclared capability.

version = 1

# The seat that judges a change.  read_only is the whole point: an agent that can edit the thing it
# is reviewing is not an adversarial reviewer, it is the author with a second hat on.
[capability.adversarial-review]
description = "Read-only adversarial review of a written change from one expert frame."
providers   = ["code-reviewer", "explorer"]
read_only   = true

# The agent that writes the change — and therefore the one that owes clarify / test-driven-change /
# diagnose / domain-modeling, all of which are disciplines OF implementing.
[capability.implementation]
description = "Write and change code, run the language toolchain, keep the workspace green."
providers   = ["python-engineer"]

[capability.reconnaissance]
description = "Locate code and map an unfamiliar area cheaply, without editing anything."
providers   = ["explorer"]
read_only   = true

[capability.orchestration]
description = "Decompose a request into least-privilege subtasks and route each to a provider."
providers   = ["orchestrator"]

[capability.derived-maintenance]
description = "Regenerate the derived memory plane by invoking the existing generators."
providers   = ["curator"]

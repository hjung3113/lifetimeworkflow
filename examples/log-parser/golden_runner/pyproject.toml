[project]
name = "logparser-golden-runner"
version = "0.0.0"
description = "Golden-runner (CONTRACT-03, D-01/02/03): spawns the .NET toy converter over the A-model CLI boundary, captures its --out file, normalizes both sides via the shared §4-5 core, diffs vs the approved .verified baseline. Ships /golden-approve minimal refusal gate (.received/.verified split, P9)."
requires-python = ">=3.11"
# Reuses libs/python normalize core (workspace member) + stdlib subprocess/difflib. No runtime deps.
dependencies = []

[tool.uv]
# Virtual member: no build-system, nothing to package. Invoked as `python -m golden_runner.runner`
# / `python -m golden_runner.approve`; the normalize core is imported by path from the workspace.
package = false

[project]
name = "logparser-strangler-guard"
version = "0.0.0"
description = "CMD-06 /strangler-step baseline-refusal gate — a runnable gate that REFUSES (non-zero exit, mirroring tools.golden_runner.approve.GoldenApprovalRefused → exit 3) when no captured legacy golden .verified baseline exists for the target path. Invoked as `python -m tools.strangler_guard <target-path>` before a strangler extraction; the command macro adds single-path-only + mandatory /golden parity. Never fabricates a baseline (machines gate, humans ratify). Stdlib-only, zero new deps."
requires-python = ">=3.11"
# D-05 / T-03-24: zero new external packages — the gate is pure pathlib+re over golden/.
# pytest for the refusal proof comes from the workspace dev group; nothing is declared here, so
# `uv sync --all-packages` must not mutate uv.lock.
dependencies = []

[tool.uv]
# Virtual member: no build-system, nothing to package. Imported by module path from the shared
# uv workspace environment (`python -m tools.strangler_guard`); no wheel is built. Mirrors
# tools/golden_runner + tools/docs_sync + tools/memory_regen + tools/contract_hash.
package = false

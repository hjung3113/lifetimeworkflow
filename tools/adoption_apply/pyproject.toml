[project]
name = "logparser-adoption-apply"
version = "0.0.0"
description = "ADOPT-04/05/07 task-local adoption batch storage, atomic/collision-safe non-constitution apply, structural constitution-plane refusal, and the /adopt command composition (draft -> apply, with the PR as the review boundary). Zero new external packages: stdlib only (hashlib, tempfile, fcntl, os, json); invoked by module path as `python -m tools.adoption_apply`."
requires-python = ">=3.11"
# Zero new external packages. All stdlib (hashlib, tempfile, fcntl, os, json, pathlib, datetime).
# jsonschema (schema-conformance) and pytest come from the workspace root runtime/dev groups;
# nothing declared here, so `uv sync --all-packages` must not mutate uv.lock.
dependencies = []

[tool.uv]
# Virtual member: no build-system, nothing to package. Imported by module path from the shared
# uv workspace environment (`python -m tools.adoption_apply...`); no wheel is built. Mirrors
# tools/adoption_scan, tools/contract_hash, tools/docs_sync, tools/memory_regen.
package = false

[project]
name = "logparser-docs-guard"
version = "0.0.0"
description = "DOCSUP-01..05 human-doc review obligation surface — the doc-dependency registry loader, the committed review ledger + disposition/digest coherence check, the deterministic source→target digest, and the five-state guard (BROKEN / STALE_REQUIRED / STALE_ADVISORY / FRESH / UNCOVERED) with its severity/exit mapping. Zero new external deps; invoked by module path as `python -m tools.docs_guard`."
requires-python = ">=3.11"
# Zero new external packages. All stdlib (hashlib, pathlib, subprocess, tomllib).
# jsonschema (schema-conformance tests) and pytest come from the workspace root runtime/dev
# groups; nothing declared here, so `uv sync --all-packages` must not mutate resolution.
dependencies = []

[tool.uv]
# Virtual member: no build-system, nothing to package. Imported by module path from the shared
# uv workspace environment (`python -m tools.docs_guard...`); no wheel is built. Mirrors
# tools/adoption_scan, tools/contract_hash, tools/memory_regen.
package = false

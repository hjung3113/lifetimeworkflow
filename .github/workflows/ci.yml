# CI mirror — "machines gate, humans ratify".
#
# This workflow mirrors the in-session guardrail hooks at merge time: it re-runs the SAME
# tools/* CLIs the harness runs interactively (contract-check, contract-drift, golden parity,
# the core pytest suite) plus a config-derived per-language test matrix, and fans them into a
# single `gate` job.
#
# TRUE non-bypassable enforcement is a REPO SETTING, not something this file can grant:
# a human must enable the `gate` job below as a REQUIRED status check in branch protection
# (Settings → Branches → branch protection rule → "Require status checks to pass").
# Until that toggle is on, this workflow is advisory. Enabling it is deliberately OUT OF SCOPE
# here (D-02: repo-config, human action).
#
# Self-validation (structural): the YAML in this file validates against the builtin
# GitHub-workflow schema via:
#   uv run check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/ci.yml
#
# Security posture:
#   * Least-privilege token — top-level `permissions: { contents: read }` (no write scope).
#   * Pinned actions — official publishers only, version-pinned (no @main/@master, no floating tags).
#   * No event interpolation — attacker-controllable `${{ github.event.* }}` fields are NEVER
#     interpolated into any `run:` shell; matrix legs derive ONLY from repo-owned harness/project.toml.

name: ci

on:
  pull_request:

# Least-privilege GITHUB_TOKEN: gate jobs read the repo, never write it.
permissions:
  contents: read

jobs:
  # ── setup ──────────────────────────────────────────────────────────────────────────────────
  # Emit the per-language test matrix from harness/project.toml (the SSOT), NOT a hardcoded list.
  # Reuses tools.harness_config.loader.languages() so adding/removing a language leg is a config
  # edit, never a workflow edit (D-01: config-derived).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages — bare `uv sync` prunes tool-member deps)
        run: uv sync --all-packages
      - name: Emit language matrix from harness/project.toml
        id: matrix
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from tools.harness_config.loader import languages
          legs = []
          for i, lang in enumerate(languages()):
              missing = [k for k in ("id", "test") if not str(lang.get(k, "")).strip()]
              if missing:
                  sys.exit(
                      f"harness/project.toml [[languages]] entry #{i} is missing required "
                      f"key(s): {', '.join(missing)} (keys present: {sorted(lang)})"
                  )
              legs.append(
                  {"id": lang["id"], "test": lang["test"], "test_paths": lang.get("test_paths", [])}
              )
          print("matrix=" + json.dumps({"include": legs}))
          PY

  # ── lang-tests ─────────────────────────────────────────────────────────────────────────────
  # Fan out one leg per configured language. The example instance supplies the .NET 10 + pytest
  # legs; toolchain install is keyed on matrix.id so .NET installs (and require_dotnet cases RUN,
  # not skip) on the dotnet leg while the python leg gets uv.
  lang-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install .NET SDK (dotnet leg)
        if: matrix.id == 'dotnet'
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '10.0.100'
      - name: Install uv (python leg)
        if: matrix.id == 'python'
        uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (python leg — dotnet leg needs no uv workspace)
        if: matrix.id == 'python'
        run: uv sync --all-packages
      # matrix.test / matrix.test_paths come from repo-owned harness/project.toml (trusted data),
      # never from event input — safe to interpolate into the run shell.
      - name: Run language test suite
        run: ${{ matrix.test }} ${{ join(matrix.test_paths, ' ') }}

  # ── contract-check ─────────────────────────────────────────────────────────────────────────
  # Mirror of /contract-check step 1: validate every <name>.schema.json against its sibling
  # instance under BOTH the core contracts/ tree AND every example instance's contracts/ tree.
  # Presence-safe: schemas with no sibling instance are skipped; a zero-pair run prints a VISIBLE
  # SKIP so a no-op is never mistaken for a pass (Pitfall 5 / T-06-09).
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: check-jsonschema over contracts/** and examples/**/contracts/**
        run: |
          shopt -s nullglob globstar
          fail=0; any=0
          for schema in contracts/**/*.schema.json examples/**/contracts/**/*.schema.json; do
            base="${schema%.schema.json}"
            for inst in "$base".yaml "$base".yml "$base".json; do
              [ -f "$inst" ] || continue
              any=1
              echo "check-jsonschema: $inst  <-  $schema"
              uv run check-jsonschema --schemafile "$schema" "$inst" || fail=1
            done
          done
          if [ "$any" -eq 0 ]; then
            echo "SKIP: no <name>.schema.json + sibling instance pairs under contracts/ or examples/**/contracts/ (schemas may be convention-only) — no-op."
          fi
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: an instance does not satisfy its schema — fix the code/instance, not the contract."
            exit 1
          fi

  # ── drift ──────────────────────────────────────────────────────────────────────────────────
  # RFC 8785 schema-hash drift gate (mirror of /contract-check step 2). Gates BOTH the root
  # manifest and the example manifest by verbatim reuse of the drift CLI (example flags shipped
  # by Plan 02 — no re-implementation, D-01).
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Drift gate — root contracts manifest
        run: uv run python -m tools.contract_drift.drift
      - name: Drift gate — example contracts manifest
        run: uv run python -m tools.contract_drift.drift --contracts-dir examples/log-parser/contracts --baseline examples/log-parser/contracts/.hashes/manifest.json

  # ── golden ─────────────────────────────────────────────────────────────────────────────────
  # Golden/approval parity. Installs .NET 10 for REAL so the example's require_dotnet cases RUN
  # (this is where the .NET egress deferral finally executes on GitHub runners), then:
  #   step 1 — root identity golden (converter-agnostic, .NET-free) via pytest tools/golden_runner
  #   step 2 — example .NET golden parity via pytest examples/log-parser/tests
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '10.0.100'
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Golden — root identity (converter-agnostic)
        run: uv run pytest tools/golden_runner
      - name: Golden — example .NET parity (require_dotnet runs)
        run: uv run pytest examples/log-parser/tests

  # ── core-suite ─────────────────────────────────────────────────────────────────────────────
  # The harness's OWN non-example pytest suite (root testpaths = tools/ + libs/python), INCLUDING
  # the GEN-03/GEN-04 guards and the Plan 01/02 enabler tests. This is the full green-suite
  # invariant that makes a harness-tooling regression non-bypassable at merge (checker W-2) —
  # distinct from golden/drift/contract-check, which exercise specific tools.
  core-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Harness core suite (tools/ + libs/python — GEN-03/04 guards included)
        run: uv run pytest

  # ── lifecycle-eval ────────────────────────────────────────────────────────────────────────
  # Phase 23 composition coverage.  This invokes the fixture runner plus the focused
  # integration/regression suite; it deliberately reuses (not reimplements) the existing
  # schema, router, transition, context, evidence, handoff, resume, and emit gates above.
  lifecycle-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Evaluate ratification-pending lane fixtures
        run: uv run python -m tools.lifecycle_eval.runner
      - name: Router and fixture expectation regression
        run: uv run pytest tools/lifecycle_eval tools/risk_router/tests
      - name: Transition, concurrency, and context-gate regression
        run: uv run pytest tools/task_control/tests
      - name: Evidence, HANDOFF, orient, and resume-gate regression
        run: uv run pytest tools/evidence/tests tools/handoff/tests

  # ── emit-drift ─────────────────────────────────────────────────────────────────────────────
  # Single-source dual-runtime re-emit-diff gate (EMIT-02, D-02). Re-runs the emitter and fails on
  # ANY hand-edited generated-artifact drift — mirrors the `drift` job's recompute→compare shape.
  # The committed .opencode/ + .claude/{agents,commands,skills} trees (and the shared config/marker
  # files) are machine-written derivatives; a divergence between source and committed output is a
  # gate FAIL. The full documented path set is diffed so later waves are already covered — paths
  # not yet emitted stay clean (empty diff), never a false positive.
  emit-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Re-emit the harness surface
        run: uv run python -m tools.harness_emit
      - name: Fail on any hand-edited generated-artifact drift
        run: git diff --exit-code -- .opencode opencode.json .claude/agents .claude/commands .claude/skills AGENTS.md CLAUDE.md .claude/settings.json

  # ── stale-derived ──────────────────────────────────────────────────────────────────────────
  # Committed-derived freshness gate (MAINT-02, D-07/D-08). A DISTINCT concern from emit-drift
  # (which covers the .opencode/.claude runtime surface); this job covers the two committed-derived
  # memory artifacts — docs/reference/** (regenerated by tools.docs_sync) and
  # .memory/derived/contracts-index.md (regenerated by tools.memory_regen.contracts_index). It
  # regenerates them, then fails on ANY diff so a stale derived plane cannot merge.
  #
  # THE ONE DEVIATION FROM emit-drift (Pitfall P1): use `git add -A` + `git diff --cached
  # --exit-code`, NOT bare `git diff`. emit-drift's outputs are all pre-tracked, but the derived
  # set can gain a NEW untracked page (e.g. a freshly-added reference page) — bare `git diff`
  # only sees tracked-file changes and would MISS it, silently passing a stale gate. Staging with
  # `git add -A` first makes newly-created pages visible to `--cached`.
  stale-derived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Regenerate the committed-derived set
        run: uv run python -m tools.docs_sync && uv run python -m tools.memory_regen.contracts_index
      - name: Fail on any stale committed-derived artifact (untracked-safe)
        run: |
          git add -A -- docs/reference .memory/derived/contracts-index.md
          if ! git diff --cached --exit-code -- docs/reference .memory/derived/contracts-index.md; then
            echo ''
            echo 'FAIL: the committed-derived plane is STALE — a derived artifact differs from its regenerated form.'
            echo 'Fix locally (never hand-edit derived files): run'
            echo ''
            echo '    /refresh-memory'
            echo ''
            echo 'or the underlying regen commands directly:'
            echo ''
            echo '    uv run python -m tools.docs_sync && uv run python -m tools.memory_regen.contracts_index'
            echo ''
            echo 'then commit the regenerated artifacts:'
            echo ''
            echo '    git add docs/reference .memory/derived/contracts-index.md && git commit'
            echo ''
            exit 1
          fi

  # ── workspace ──────────────────────────────────────────────────────────────────────────────
  # Cross-repo (multi-repo workspace) gate (MREPO-03). A SEPARATE job — cross-repo drift/golden are
  # NOT folded into the per-repo `drift`/`golden` jobs (anti-pattern) — mirroring the emit-drift /
  # stale-derived separate-job idiom. It iterates the workspace.toml members + edges:
  #   step 1 — cross-repo contract-drift (per-member baselines + edge-contract resolution)
  #   step 2 — the cross-repo pytest set (loader + consistency gate + GEN-04 twin + workspace
  #            golden + workspace drift)
  # Security posture preserved: pinned actions, top-level `permissions: contents: read`, and NO
  # `${{ github.event.* }}` interpolation into any run shell (all data from repo-owned files).
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Sync workspace (all packages)
        run: uv sync --all-packages
      - name: Cross-repo drift — workspace members + edges
        run: uv run python -m tools.contract_drift.drift --workspace
      - name: Cross-repo golden + workspace gates
        run: uv run pytest tools/workspace_config tools/harness_lint/tests/test_workspace_config.py tools/harness_lint/tests/test_core_no_workspace_member_dep.py tools/golden_runner/tests/test_workspace_golden.py tools/contract_drift/tests/test_workspace_drift.py

  # ── gate ───────────────────────────────────────────────────────────────────────────────────
  # Fan-in. Depends on every upstream job; runs even when one fails (if: always()) and FAILS if
  # any upstream job failed or was cancelled. This is the single job a human enables as a REQUIRED
  # status check in branch protection to make the whole mirror non-bypassable (D-02, out of scope
  # here). needs.*.result values are workflow-computed enums (success/failure/cancelled/skipped),
  # NOT event input — safe to interpolate.
  gate:
    needs: [setup, lang-tests, contract-check, drift, golden, core-suite, lifecycle-eval, emit-drift, stale-derived, workspace]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fan-in — fail on any upstream failure or cancellation
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "upstream results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "GATE FAIL: an upstream job failed or was cancelled."
              exit 1 ;;
          esac
          echo "GATE PASS: all upstream jobs succeeded."
